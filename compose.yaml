services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      API_PORT: 3000
    ports:
      - '${API_PORT}:3000'
    command: ['pnpm', 'start:api']
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    environment:
      API_URL: http://api:3000
    ports:
      - '${WEB_PORT}:5173'
    command:
      ['pnpm', '--filter', '@standard-model/web', 'preview', '--host', '0.0.0.0', '--port', '5173']
    depends_on:
      - api

volumes:
  postgres-data:
